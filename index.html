<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="assets/Logo.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MarTina Střechová</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <a href="#main-content" class="skip-link">Přeskočit na obsah / Skip to content</a>

  <header id="site-header">
    <button id="menu-btn" aria-label="Otevřít menu">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <a href="index.html" class="header-logo">
      <img src="assets/podpis.jpg" alt="Podpis" height="50">
    </a>

    <div class="lang-switcher">
      <button id="lang-toggle" aria-label="Přepnout jazyk">CZ</button>
    </div>
  </header>

  <img class="deco-stars deco-stars--top" src="assets/stars.png" alt="">

  <div id="menu-overlay" role="dialog" aria-modal="true" aria-label="Navigace" aria-hidden="true">
    <nav class="menu-nav">
      <a href="index.html" class="menu-item menu-item--home">
        <img src="assets/Home.svg" alt="Domů">
      </a>
      <a href="cv.html" class="menu-item">CV</a>
      <a href="contacts.html" class="menu-item" data-cz="Kontakty" data-en="Contacts">Kontakty</a>
    </nav>
  </div>

  <span id="main-content"></span>
  <main id="home">
    <h1 class="visually-hidden">MarTina Střechová — osobní web</h1>
    <section id="milestone-section">
      <div id="milestone-image">
        <img id="milestone-img" src="" alt="" />
        <p id="timeline-instructions" data-cz="Posuň mou hlavu po ose<br>a objevuj můj příběh." data-en="Drag my head along the timeline<br>and discover my story.">Posuň mou hlavu po ose<br>a objevuj můj příběh.</p>
      </div>
      <div id="timeline-container">
        <div id="timeline-track">
          <img id="timeline-img" src="assets/osa.jpg" alt="Časová osa" style="width: 100%;">
          <img src="assets/hlava_1.png" alt="Martina Střechová" id="timeline-head">
        </div>
      </div>
      <div id="milestone-content">
        <div id="milestone-header">
          <span id="milestone-rok"></span>
          <button id="audio-btn"><img src="assets/Sound.svg" alt="Přehrát audio" style="height: 1.5rem; width: auto;"></button>
          <div class="nadpis-wrap">
            <h2 id="milestone-nadpis"></h2>
          </div>
        </div>
        <p id="milestone-text"></p>
      </div>
      <audio id="audio-player" preload="none"></audio>
      <img class="deco-stars deco-stars--left" src="assets/stars.png" alt="">
    </section>
  </main>

  <footer id="site-footer">
    <p>© MarTina Střechová 2026</p>
  </footer>

  <script src="data/milniky.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
