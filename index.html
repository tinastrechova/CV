<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Osobní web</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header id="site-header">
    <button id="menu-btn" aria-label="Otevřít menu">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <a href="index.html" class="header-logo">
      <img src="assets/podpis.jpg" alt="Podpis" height="50">
    </a>

    <div class="lang-switcher">
      <button id="lang-cz" class="active">CZ</button>
      <button id="lang-en">EN</button>
    </div>
  </header>

  <div id="menu-overlay" role="dialog" aria-modal="true" aria-label="Navigace" aria-hidden="true">
    <nav class="menu-nav">
      <a href="index.html" class="menu-item menu-item--home">
        <img src="assets/Home.svg" alt="Domů">
      </a>
      <a href="cv.html" class="menu-item">CV</a>
      <a href="kontakty.html" class="menu-item" data-cz="Kontakty" data-en="Contacts">Kontakty</a>
    </nav>
  </div>

  <main id="home">
    <section id="milestone-section">
      <div id="milestone-image">
        <img id="milestone-img" src="" alt="" />
      </div>
      <div id="milestone-content">
        <div id="milestone-header">
          <span id="milestone-rok"></span>
          <div class="nadpis-wrap">
            <button id="audio-btn"><img src="assets/Sound.svg" alt="Přehrát audio" style="height: 1.5rem; width: auto;"></button>
            <h2 id="milestone-nadpis"></h2>
          </div>
        </div>
        <p id="milestone-text"></p>
      </div>
      <audio id="audio-player" preload="none"></audio>
    </section>
  </main>

  <script src="data/milniky.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
